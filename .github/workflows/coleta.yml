name: Coleta de ajustes B3

on:
  schedule:
    # 19h de Brasília (22:00 UTC): primeira tentativa, seg a sex
    - cron: "0 22 * * 1-5"
    # 20h30 de Brasília (23:30 UTC): confirma/atualiza com o boletim final
    - cron: "30 23 * * 1-5"
  workflow_dispatch:
    inputs:
      inicio:
        description: "Carga histórica: data inicial (AAAA-MM-DD). Vazio = últimos 5 dias"
        required: false
      fim:
        description: "Carga histórica: data final (AAAA-MM-DD)"
        required: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Coletar e gravar no Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          INICIO: ${{ inputs.inicio }}
          FIM: ${{ inputs.fim }}
        run: |
          if [ -n "$INICIO" ]; then
            if [ -n "$FIM" ]; then
              python coletor.py --inicio "$INICIO" --fim "$FIM" --csv ajustes.csv
            else
              python coletor.py --inicio "$INICIO" --csv ajustes.csv
            fi
          else
            python coletor.py --dias 5 --csv ajustes.csv
          fi

      - name: Guardar CSV da execução (backup por 30 dias)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ajustes-${{ github.run_id }}
          path: ajustes.csv
          if-no-files-found: ignore
          retention-days: 30

      - name: Mostrar dados coletados
        if: always()
        run: |
          if [ -f ajustes.csv ]; then
            echo "::group::ajustes.csv"; cat ajustes.csv; echo "::endgroup::"
          fi
