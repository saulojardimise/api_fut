name: Coleta de ajustes B3

on:
  schedule:
    # 19h de Brasília (22:00 UTC): primeira tentativa, seg a sex
    - cron: "0 22 * * 1-5"
    # 20h30 de Brasília (23:30 UTC): confirma o boletim final e VERIFICA o dia
    - cron: "30 23 * * 1-5"
  workflow_dispatch:
    inputs:
      inicio:
        description: "Reprocessar a partir de (AAAA-MM-DD). Vazio = últimos 5 dias"
        required: false
      fim:
        description: "Até (AAAA-MM-DD)"
        required: false
      verificar:
        description: "Rodar as checagens de qualidade do pregão de hoje"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write   # para o passo que mantém o agendamento ativo

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Coletar e gravar no Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          INICIO: ${{ inputs.inicio }}
          FIM: ${{ inputs.fim }}
          # verifica na execução das 20h30 ou quando pedido manualmente
          VERIFICAR: ${{ github.event.schedule == '30 23 * * 1-5' || inputs.verificar == true }}
        run: |
          ARGS=(--csv ajustes.csv)
          if [ -n "$INICIO" ]; then
            ARGS+=(--inicio "$INICIO")
            [ -n "$FIM" ] && ARGS+=(--fim "$FIM")
          else
            ARGS+=(--dias 5)
          fi
          [ "$VERIFICAR" = "true" ] && ARGS+=(--verificar)
          python coletor.py "${ARGS[@]}"

      - name: Mostrar dados coletados
        if: always()
        run: |
          if [ -f ajustes.csv ]; then
            echo "::group::ajustes.csv"; cat ajustes.csv; echo "::endgroup::"
          fi

      - name: Manter o agendamento ativo
        # O GitHub desativa agendamentos após 60 dias sem commits em repositórios públicos
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/coleta.yml/enable"
