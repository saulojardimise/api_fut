name: Coleta de ajustes B3

on:
  schedule:
    # 22h de Brasília (01:00 UTC), de segunda a sexta (no UTC: terça a sábado)
    - cron: "0 1 * * 2-6"
  workflow_dispatch:
    inputs:
      inicio:
        description: "Carga histórica: data inicial (AAAA-MM-DD). Vazio = últimos 5 dias"
        required: false
      fim:
        description: "Carga histórica: data final (AAAA-MM-DD)"
        required: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Coletar e gravar no Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          INICIO: ${{ inputs.inicio }}
          FIM: ${{ inputs.fim }}
        run: |
          if [ -n "$INICIO" ]; then
            if [ -n "$FIM" ]; then
              python coletor.py --inicio "$INICIO" --fim "$FIM"
            else
              python coletor.py --inicio "$INICIO"
            fi
          else
            python coletor.py --dias 5
          fi
